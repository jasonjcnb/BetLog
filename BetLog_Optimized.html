<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bet Log">
<meta name="theme-color" content="#0B0D12">
<title>Bet Log</title>

<!-- PWA Manifest inline via JS -->
<script>
const manifest = {
  name: "Betting Log",
  short_name: "Bet Log",
  start_url: ".",
  display: "standalone",
  background_color: "#0B0D12",
  theme_color: "#0B0D12",
  icons: [{
    src: "data:image/svg+xml," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='%230B0D12'/><text x='256' y='340' font-size='280' text-anchor='middle' fill='%235B8DEF'>📈</text></svg>`),
    sizes: "512x512", type: "image/svg+xml", purpose: "any maskable"
  }]
};
const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
const link = document.createElement('link');
link.rel = 'manifest';
link.href = URL.createObjectURL(blob);
document.currentScript.after(link);
</script>

<!-- Apple touch icon -->
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230B0D12'/%3E%3Ctext x='256' y='340' font-size='280' text-anchor='middle' fill='%235B8DEF'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#070B12; --surface:#101827; --surface2:#162235;
  --border:#223047; --text:#F5F7FB; --muted:#8E9AAF;
  --green:#35E07A; --green-dim:rgba(53,224,122,0.14);
  --red:#FF6B63; --red-dim:rgba(255,107,99,0.14);
  --accent:#4FD66D; --accent-dim:rgba(79,214,109,0.14);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
html,body{ height:100%; overflow:hidden; background:var(--bg); }

/* Full-screen shell */
#app{
  display:flex; flex-direction:column; height:100%;
  padding-top: max(var(--safe-top), 20px);
  background:radial-gradient(circle at 50% -20%, #15213a 0%, var(--bg) 42%); color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}

/* Header */
.hdr{
  padding: 8px 16px 14px;
  flex-shrink:0;
}
.hdr-title{
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:28px; letter-spacing:-0.01em;
}
.hdr-sub{ color:var(--muted); font-size:12px; margin-top:3px; }
.hdr-row{display:flex;align-items:center;justify-content:space-between}.hdr-badge{font-size:12px;font-weight:700;color:var(--green);background:var(--green-dim);border:1px solid rgba(53,224,122,.25);padding:6px 10px;border-radius:999px}

/* Tab bar – bottom native-style */
.tab-bar{
  display:flex; background:rgba(10,16,27,.94); backdrop-filter:blur(18px); border-top:1px solid var(--border);
  padding-bottom: max(var(--safe-bot), 8px);
  flex-shrink:0;
}
.tab-btn{
  flex:1; display:flex; flex-direction:column; align-items:center;
  padding:10px 4px 6px; gap:3px; cursor:pointer; color:var(--muted);
  font-size:10px; font-weight:600; user-select:none;
  transition:color .15s;
}
.tab-btn svg{ width:24px; height:24px; }
.tab-btn.active{ color:var(--accent); }

/* Scrollable content area */
.content{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.view{ display:none; padding:0 16px 24px; }
.view.active{ display:block; }

/* Form */
.form-card{
  background:linear-gradient(180deg,rgba(20,31,49,.98),rgba(13,22,36,.98)); border:1px solid var(--border); border-radius:18px; box-shadow:0 12px 30px rgba(0,0,0,.22);
  padding:14px; margin-bottom:14px;
}
.form-row{ display:flex; gap:8px; margin-bottom:10px; }
.field{ display:flex; flex-direction:column; gap:4px; flex:1; min-width:0; }
.field label{ font-size:11px; color:var(--muted); letter-spacing:0.02em; }
.field input{
  background:var(--surface2); border:1px solid var(--border); border-radius:12px;
  color:var(--text); padding:12px 10px; font-size:16px; font-family:inherit;
  font-variant-numeric:tabular-nums; width:100%;
  -webkit-appearance:none;
}
.field input:focus{ outline:none; border-color:var(--accent); }
.add-btn{
  width:100%; background:linear-gradient(135deg,#35E07A,#26B95E); color:#06110A; border:none; border-radius:13px;
  padding:14px; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit;
  margin-top:2px;
}
.add-btn:active{ opacity:.85; transform:scale(.99); }
.err{ color:var(--red); font-size:12px; margin-top:8px; min-height:14px; }

/* Cards */
.list{ display:flex; flex-direction:column; gap:8px; }
.card{
  background:linear-gradient(180deg,rgba(18,29,47,.98),rgba(13,22,36,.98)); border:1px solid var(--border); border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,.16);
  padding:12px 14px;
}
.card-top{ display:flex; justify-content:space-between; align-items:flex-start; }
.card-date{ font-size:13.5px; font-weight:600; }
.card-note{ font-size:12px; color:var(--muted); margin-top:2px; }
.card-bot{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
.units-tag{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.chip{
  font-size:13px; font-weight:700; padding:4px 10px; border-radius:999px;
  font-variant-numeric:tabular-nums;
}
.chip.pos{ background:var(--green-dim); color:var(--green); }
.chip.neg{ background:var(--red-dim); color:var(--red); }
.chip.zero{ background:var(--surface2); color:var(--muted); }
.del-btn{
  background:none; border:none; color:var(--muted); cursor:pointer; font-size:16px;
  padding:4px 6px; border-radius:6px; line-height:1;
}
.del-btn:active{ color:var(--red); }

/* Daily rows */
.day-row{ display:flex; justify-content:space-between; align-items:center; }
.day-left .day-date{ font-size:14px; font-weight:600; }
.day-left .day-meta{ font-size:12px; color:var(--muted); margin-top:2px; }
.day-right{ text-align:right; }
.day-ret{ font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; }
.day-run{ font-size:11px; color:var(--muted); margin-top:2px; font-variant-numeric:tabular-nums; }

/* Summary */
.stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
.stat-card{
  background:linear-gradient(180deg,rgba(18,29,47,.98),rgba(13,22,36,.98)); border:1px solid var(--border); border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,.16);
  padding:13px 14px;
}
.stat-label{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px; }
.stat-value{
  font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600;
  font-variant-numeric:tabular-nums;
}
.stat-value.pos{ color:var(--green); }
.stat-value.neg{ color:var(--red); }
.stat-sub{ font-size:11px; color:var(--muted); margin-top:3px; }

.empty{ color:var(--muted); font-size:13px; padding:40px 10px; text-align:center; }
.reset-btn{
  width:100%; background:none; border:1px solid var(--border); color:var(--muted);
  font-size:13px; padding:12px; border-radius:13px; cursor:pointer; font-family:inherit;
}
.reset-btn:active{ border-color:var(--red); color:var(--red); }

/* Install banner */
.install-banner{
  display:none; background:var(--accent-dim); border:1px solid var(--accent);
  border-radius:12px; padding:12px 14px; margin-bottom:14px; font-size:13px;
  color:var(--text); line-height:1.5;
}
.install-banner strong{ color:var(--accent); }
.install-close{
  float:right; background:none; border:none; color:var(--muted);
  font-size:16px; cursor:pointer; padding:0 0 0 8px;
}
</style>
</head>
<body>
<div id="app">
  <div class="hdr"><div class="hdr-row"><div><div class="hdr-title">Bet Log</div><div class="hdr-sub">Track smarter. Bet cleaner.</div></div><div class="hdr-badge" id="header-profit">0.00u</div></div></div>

  <div class="content">
    <!-- LOG VIEW -->
    <div class="view active" id="view-log">
      <div class="install-banner" id="install-banner">
        <button class="install-close" id="install-close">✕</button>
        <strong>📱 加到主屏幕</strong><br>
        Safari → 底部分享按钮 →「加入主屏幕」→ 像 App 一样全屏使用
      </div>
      <div class="stat-grid" id="quick-stats" style="grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;">
        <div class="stat-card"><div class="stat-label">Units</div><div class="stat-value" id="qs-units">0.00</div></div>
        <div class="stat-card"><div class="stat-label">Profit</div><div class="stat-value" id="qs-profit">0.00</div></div>
        <div class="stat-card"><div class="stat-label">ROI</div><div class="stat-value" id="qs-roi">0.0%</div></div>
      </div>
      <div class="form-card">
        <div class="form-row">
          <div class="field">
            <label>日期</label>
            <input type="date" id="bt-date" />
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>这单是什么（可选）</label>
            <input type="text" id="bt-note" placeholder="Sinner vs Shelton ML" />
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>Odds（可选）</label>
            <input type="number" id="bt-odds" step="0.01" inputmode="decimal" placeholder="1.91" />
          </div>
          <div class="field">
            <label>Units</label>
            <input type="number" id="bt-units" step="0.1" inputmode="decimal" placeholder="1" />
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>Payout（输了填 0）</label>
            <input type="number" id="bt-payout" step="0.01" inputmode="decimal" placeholder="1.91" />
          </div>
          <div class="field">
            <label>收益（自动）</label>
            <input type="number" id="bt-return" readonly tabindex="-1" style="color:var(--muted);background:var(--bg);border-color:transparent;" placeholder="–" />
          </div>
        </div>
        <button class="add-btn" id="bt-add">添加这一单</button>
        <div class="err" id="bt-err"></div>
      </div>
      <div class="list" id="log-list"><div class="empty">还没有记录，填上面的表单加第一单</div></div>
    </div>

    <!-- DAILY VIEW -->
    <div class="view" id="view-daily">
      <div class="list" id="daily-list"><div class="empty">暂无数据</div></div>
    </div>

    <!-- SUMMARY VIEW -->
    <div class="view" id="view-summary">
      <div class="stat-grid" id="stat-grid"></div>
      <button class="reset-btn" id="reset-btn">清空所有记录</button>
    </div>
  </div>

  <!-- Bottom tab bar -->
  <div class="tab-bar">
    <div class="tab-btn active" data-tab="log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      记录
    </div>
    <div class="tab-btn" data-tab="daily">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      每日
    </div>
    <div class="tab-btn" data-tab="summary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      汇总
    </div>
  </div>
</div>

<script>
(function(){
  const KEY = 'betlog-v3';
  let entries = [];

  // Tabs
  const tabBtns = document.querySelectorAll('.tab-btn');
  const viewEls = { log: document.getElementById('view-log'), daily: document.getElementById('view-daily'), summary: document.getElementById('view-summary') };
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('active'));
      Object.values(viewEls).forEach(v => v.classList.remove('active'));
      btn.classList.add('active');
      viewEls[btn.dataset.tab].classList.add('active');
    });
  });

  // Install banner: show if not standalone
  const banner = document.getElementById('install-banner');
  if (!window.navigator.standalone) banner.style.display = 'block';
  document.getElementById('install-close').addEventListener('click', () => banner.style.display = 'none');

  // Inputs
  const dateEl = document.getElementById('bt-date');
  const noteEl = document.getElementById('bt-note');
  const oddsEl = document.getElementById('bt-odds');
  const payoutEl = document.getElementById('bt-payout');
  const unitsEl = document.getElementById('bt-units');
  const retEl = document.getElementById('bt-return');

  function calcRet(){
    const p=parseFloat(payoutEl.value), u=parseFloat(unitsEl.value);
    retEl.value=(!isNaN(p)&&!isNaN(u))?(Math.round((p-u)*100)/100).toFixed(2):'';
  }
  payoutEl.addEventListener('input',calcRet);
  unitsEl.addEventListener('input',calcRet);
  const errEl = document.getElementById('bt-err');

  function today(){
    const d = new Date(), off = d.getTimezoneOffset();
    return new Date(d - off*60000).toISOString().slice(0,10);
  }
  dateEl.value = today();

  // Storage — use localStorage when window.storage isn't available (standalone PWA)
  async function storeSave(data){
    try{
      if(window.storage) await window.storage.set(KEY, data, false);
      else localStorage.setItem(KEY, data);
    }catch(e){ localStorage.setItem(KEY, data); }
  }
  async function storeLoad(){
    try{
      if(window.storage){
        const r = await window.storage.get(KEY, false);
        return r && r.value ? r.value : null;
      }
    }catch(e){}
    return localStorage.getItem(KEY);
  }

  async function save(){ await storeSave(JSON.stringify(entries)); }
  async function load(){
    const raw = await storeLoad();
    entries = raw ? JSON.parse(raw) : [];
    renderAll();
  }

  // Format helpers
  const f2 = n => (Math.round(n*100)/100).toFixed(2);
  const fpm = n => { const v=Math.round(n*100)/100; return (v>0?'+':'')+v.toFixed(2); };
  const cls = n => n>0?'pos':n<0?'neg':'zero';
  const wd = s => ['日','一','二','三','四','五','六'][new Date(s+'T00:00:00').getDay()];
  const esc = s => { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; };

  function sortDesc(){ return [...entries].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id); }
  function sortAsc(){ return [...entries].sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id); }

  function renderAll(){ renderLog(); renderDaily(); renderSummary(); renderQuick(); }

  function renderQuick(){
    const totalU=entries.reduce((s,e)=>s+e.units,0);
    const totalR=entries.reduce((s,e)=>s+e.ret,0);
    const roi=totalU>0?totalR/totalU:0;
    const pu=document.getElementById('qs-units'), pp=document.getElementById('qs-profit'), pr=document.getElementById('qs-roi'), hp=document.getElementById('header-profit');
    if(pu) pu.textContent=f2(totalU);
    if(pp){pp.textContent=fpm(totalR);pp.className='stat-value '+cls(totalR);}
    if(pr){pr.textContent=(roi*100).toFixed(1)+'%';pr.className='stat-value '+cls(roi);}
    if(hp){hp.textContent=fpm(totalR)+'u';hp.style.color=totalR<0?'var(--red)':'var(--green)';hp.style.background=totalR<0?'var(--red-dim)':'var(--green-dim)';}
  }

  function renderLog(){
    const el = document.getElementById('log-list');
    const list = sortDesc();
    if(!list.length){ el.innerHTML='<div class="empty">还没有记录，填上面的表单加第一单</div>'; return; }
    el.innerHTML = list.map(e=>`
      <div class="card">
        <div class="card-top">
          <div>
            <div class="card-date">${e.date} <span style="color:var(--muted);font-weight:400;font-size:12px;">周${wd(e.date)}</span></div>
            ${e.note?`<div class="card-note">${esc(e.note)}</div>`:''}
          </div>
          <button class="del-btn" data-id="${e.id}">✕</button>
        </div>
        <div class="card-bot">
          <span class="units-tag">${e.odds?`@${f2(e.odds)} · `:''}${f2(e.units)}u → ${e.payout!=null?f2(e.payout):'–'}</span>
          <span class="chip ${cls(e.ret)}">${fpm(e.ret)}</span>
        </div>
      </div>`).join('');
    el.querySelectorAll('.del-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.id;
        entries = entries.filter(e=>String(e.id)!==id);
        await save(); renderAll();
      });
    });
  }

  function byDay(){
    const map={};
    sortAsc().forEach(e=>{
      if(!map[e.date]) map[e.date]={date:e.date,bets:0,units:0,ret:0};
      map[e.date].bets++; map[e.date].units+=e.units; map[e.date].ret+=e.ret;
    });
    return Object.values(map).sort((a,b)=>a.date.localeCompare(b.date));
  }

  function renderDaily(){
    const el = document.getElementById('daily-list');
    const days = byDay();
    if(!days.length){ el.innerHTML='<div class="empty">暂无数据</div>'; return; }
    let run=0;
    const rows = days.map(d=>{ run+=d.ret; return {...d,run}; }).reverse();
    el.innerHTML = rows.map(d=>`
      <div class="card">
        <div class="day-row">
          <div class="day-left">
            <div class="day-date">${d.date} <span style="color:var(--muted);font-weight:400;font-size:12px;">周${wd(d.date)}</span></div>
            <div class="day-meta">${d.bets} 单 · ${f2(d.units)} units</div>
          </div>
          <div class="day-right">
            <div class="day-ret" style="color:${d.ret>0?'var(--green)':d.ret<0?'var(--red)':'var(--muted)'}">${fpm(d.ret)}</div>
            <div class="day-run">累计 ${fpm(d.run)}</div>
          </div>
        </div>
      </div>`).join('');
  }

  function renderSummary(){
    const el = document.getElementById('stat-grid');
    const n = entries.length;
    const totalU = entries.reduce((s,e)=>s+e.units,0);
    const totalR = entries.reduce((s,e)=>s+e.ret,0);
    const wins = entries.filter(e=>e.ret>0).length;
    const losses = entries.filter(e=>e.ret<0).length;
    const wr = (wins+losses)>0 ? wins/(wins+losses) : 0;
    const roi = totalU>0 ? totalR/totalU : 0;
    const avg = n>0 ? totalR/n : 0;
    const days = byDay();
    let best=null, worst=null;
    days.forEach(d=>{ if(!best||d.ret>best.ret)best=d; if(!worst||d.ret<worst.ret)worst=d; });
    const oe = entries.filter(e=>e.odds&&e.odds>0);
    const avgO = oe.length ? oe.reduce((s,e)=>s+e.odds,0)/oe.length : null;

    const tiles = [
      {l:'总单数', v:n, s:`${days.length} 天`},
      {l:'胜率', v:(wr*100).toFixed(0)+'%', s:`${wins}胜 ${losses}负`},
      {l:'总投入', v:f2(totalU), s:'Units'},
      {l:'总收益', v:fpm(totalR), s:'Units', c:cls(totalR)},
      {l:'ROI', v:(roi*100).toFixed(1)+'%', s:'收益 ÷ 投入', c:cls(roi)},
      {l:'平均每单', v:fpm(avg), s:'Units', c:cls(avg)},
      {l:'平均 Odds', v:avgO?avgO.toFixed(2):'–', s:avgO?`${oe.length} 单`:'暂无'},
      {l:'最佳一天', v:best?fpm(best.ret):'–', s:best?best.date:'—', c:'pos'},
      {l:'最差一天', v:worst?fpm(worst.ret):'–', s:worst?worst.date:'—', c:'neg'},
    ];
    el.innerHTML = tiles.map(t=>`
      <div class="stat-card">
        <div class="stat-label">${t.l}</div>
        <div class="stat-value ${t.c||''}">${t.v}</div>
        <div class="stat-sub">${t.s}</div>
      </div>`).join('');
  }

  document.getElementById('bt-add').addEventListener('click', addEntry);
  [noteEl,oddsEl,payoutEl,unitsEl].forEach(el=>el.addEventListener('keydown',ev=>{ if(ev.key==='Enter') addEntry(); }));

  async function addEntry(){
    errEl.textContent='';
    const date=dateEl.value, note=noteEl.value.trim();
    const oddsRaw=oddsEl.value, odds=oddsRaw===''?null:parseFloat(oddsRaw);
    const units=parseFloat(unitsEl.value);
    const payout=parseFloat(payoutEl.value);
    if(!date){ errEl.textContent='请选日期'; return; }
    if(oddsRaw!==''&&(isNaN(odds)||odds<=0)){ errEl.textContent='Odds 要大于 0，或留空'; return; }
    if(isNaN(units)||units<0){ errEl.textContent='请输入有效的 Units'; return; }
    if(isNaN(payout)||payout<0){ errEl.textContent='请输入 Payout（输了填 0）'; return; }
    const ret=Math.round((payout-units)*100)/100;
    entries.push({id:Date.now()+Math.random(), date, note, odds, units, payout, ret});
    await save(); renderAll();
    noteEl.value=''; oddsEl.value=''; payoutEl.value=''; unitsEl.value=''; retEl.value='';
    unitsEl.focus();
  }

  document.getElementById('reset-btn').addEventListener('click', async ()=>{
    if(!confirm('确定清空所有记录吗？')) return;
    entries=[]; await save(); renderAll();
  });

  // Service Worker for offline
  if('serviceWorker' in navigator){
    const sw = `
      const CACHE='betlog-v1';
      self.addEventListener('install', e=>{ e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['.']))); self.skipWaiting(); });
      self.addEventListener('activate', e=>{ e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k))))); });
      self.addEventListener('fetch', e=>{ e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))); });
    `;
    const blob = new Blob([sw], {type:'text/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob));
  }

  load();
})();
</script>
</body>
</html>
